<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Config Manager</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111827;
      color: white;
      padding: 1.5rem 2rem;
      font-size: 1.75rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    header nav {
      display: flex;
      gap: 1.25rem;
      font-size: 1rem;
    }

    header nav a {
      color: #cbd5f5;
      text-decoration: none;
      padding-bottom: 0.25rem;
      border-bottom: 2px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    header nav a:hover {
      color: #ffffff;
    }

    header nav a.active {
      color: #ffffff;
      border-bottom-color: #60a5fa;
    }

    .language-select {
      width: auto;
      min-width: 120px;
      font-family: inherit;
      background: #1f2937;
      color: white;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 0.35rem 0.5rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding: 1.5rem 2rem 3rem 2rem;
      box-sizing: border-box;
    }

    .section-card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    h2 {
      margin: 0;
      font-size: 1.25rem;
      color: #0f172a;
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: #1f2937;
    }

    input[type="text"], textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 0.5rem 0.75rem;
      border: 1px solid #cbd5f5;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
      background: #f9fafb;
      color: #1f2937;
    }

    textarea {
      min-height: 140px;
      line-height: 1.4;
      resize: vertical;
      tab-size: 2;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
    }

    button.secondary {
      background: #e5e7eb;
      color: #1f2937;
    }

    button.danger {
      background: #dc2626;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status-banner {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
      white-space: pre-wrap;
    }

    .status-banner.info {
      background: #e0f2fe;
      color: #0c4a6e;
    }

    .status-banner.success {
      background: #dcfce7;
      color: #14532d;
    }

    .status-banner.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .devices-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .device-card {
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 1.25rem;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .device-card__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .device-card__title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #1f2937;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .field-inline {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .schedule-card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 1rem;
      background: white;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .schedule-card__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .schedule-card__title {
      font-weight: 600;
      color: #1f2937;
    }

    .empty-hint {
      font-size: 0.95rem;
      color: #475569;
      background: #f1f5f9;
      border-radius: 10px;
      padding: 1rem;
    }

    .hint {
      font-size: 0.85rem;
      color: #64748b;
      margin: 0;
    }

    .field-error {
      border-color: #dc2626 !important;
      background: #fef2f2 !important;
    }

    @media (max-width: 768px) {
      main {
        padding: 1rem 1.25rem 2.5rem 1.25rem;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .section-card {
        padding: 1.25rem;
      }

      .device-card {
        padding: 1rem;
      }

      .schedule-card {
        padding: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <span data-i18n="header.title">DotCanvas</span>
      <nav>
        <a href="canvas.html" data-i18n="nav.canvas">画布编辑</a>
        <a href="daemon.html" data-i18n="nav.daemon">守护进程控制</a>
        <a href="config.html" class="active" data-i18n="nav.config">配置管理</a>
      </nav>
    </div>
    <select id="language-select" class="language-select">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
  </header>

  <main>
    <div id="status-banner" class="status-banner"></div>

    <section class="section-card">
      <div class="section-header">
        <h2 data-i18n="section.api">API 设置</h2>
        <div class="section-actions">
          <button id="reload-config" class="secondary" data-i18n="button.reload">重新加载</button>
          <button id="save-config" data-i18n="button.save">保存配置</button>
        </div>
      </div>
      <div class="field-group">
        <label for="api-key-input" data-i18n="label.apiKey">API 密钥</label>
        <input type="text" id="api-key-input" placeholder="dot_app_xxxxxxxx" />
        <p class="hint" data-i18n="hint.apiKey">请粘贴来自服务提供商的完整密钥。</p>
      </div>
    </section>

    <section class="section-card">
      <div class="section-header">
        <h2 data-i18n="section.devices">设备与计划任务</h2>
        <button id="add-device" class="secondary" data-i18n="button.addDevice">添加设备</button>
      </div>
      <div id="devices-container" class="devices-container"></div>
      <p class="hint" data-i18n="hint.paramsFormat">参数使用 JSON 格式，如 {"key": "value"}。</p>
    </section>
  </main>

  <script src="dotcanvas-message-box.js"></script>
  <script>
    const languageSelect = document.getElementById('language-select');
    const statusBanner = document.getElementById('status-banner');
    const apiKeyInput = document.getElementById('api-key-input');
    const saveButton = document.getElementById('save-config');
    const reloadButton = document.getElementById('reload-config');
    const addDeviceButton = document.getElementById('add-device');
    const devicesContainer = document.getElementById('devices-container');

    const paramsKey = schedule => {
      if (!schedule || typeof schedule !== 'object') {
        return '';
      }
      if (typeof schedule._uid !== 'number') {
        schedule._uid = state.nextUid++;
      }
      return String(schedule._uid);
    };

    const scheduleKeyFromPayload = schedule =>
      schedule && typeof schedule._uid === 'number' ? String(schedule._uid) : '';

    const storedLanguage = (() => {
      try {
        return localStorage.getItem('dotcanvas-language');
      } catch (err) {
        console.debug('Unable to read language preference', err);
        return null;
      }
    })();

    const translations = {
      zh: {
        'header.title': 'DotCanvas',
        'nav.canvas': '画布编辑',
        'nav.daemon': '守护进程控制',
        'nav.config': '配置管理',
        'section.api': 'API 设置',
        'section.devices': '设备与计划任务',
        'label.apiKey': 'API 密钥',
        'hint.apiKey': '请粘贴来自服务提供商的完整密钥。',
        'button.save': '保存配置',
        'button.reload': '重新加载',
        'button.addDevice': '添加设备',
        'button.addSchedule': '添加任务',
        'button.removeDevice': '删除设备',
        'button.removeSchedule': '删除任务',
        'label.deviceName': '设备名称',
        'label.deviceId': '设备 ID',
        'label.scheduleName': '任务名称',
        'label.scheduleCanvasId': '画布 ID',
        'label.scheduleCron': 'Cron 表达式',
        'label.scheduleParams': '参数 (JSON)',
        'hint.paramsFormat': '参数使用 JSON 格式，如 {"key": "value"}。',
        'device.title': '设备 {index}',
        'schedule.title': '任务 {index}',
        'status.loading': '正在加载配置...',
        'status.loaded': '配置已加载。',
        'status.saved': '配置已保存。',
        'status.reloaded': '配置已从文件重新加载。',
        'status.saveError': '保存失败：{message}',
        'status.loadError': '加载配置失败：{message}',
        'status.paramsInvalid': '部分任务参数不是有效的 JSON，请检查标记为红色的输入。',
        'empty.devices': '尚未配置任何设备。点击“添加设备”开始配置。',
        'empty.schedules': '该设备尚未配置任务，添加第一个任务。',
        'confirm.deleteDevice': '确定要删除此设备吗？',
        'confirm.deleteSchedule': '确定要删除此任务吗？',
        'placeholder.deviceName': '设备1',
        'placeholder.deviceId': '1A2B3C4D1234',
        'placeholder.scheduleName': '任务1',
        'placeholder.scheduleCanvasId': 'canvas1',
        'placeholder.scheduleCron': '*/5 * * * *',
      },
      en: {
        'header.title': 'DotCanvas',
        'nav.canvas': 'Canvas Editor',
        'nav.daemon': 'Daemon Control',
        'nav.config': 'Config Manager',
        'section.api': 'API Settings',
        'section.devices': 'Devices & Schedules',
        'label.apiKey': 'API Key',
        'hint.apiKey': 'Paste the API key obtained from your service provider.',
        'button.save': 'Save Config',
        'button.reload': 'Reload',
        'button.addDevice': 'Add Device',
        'button.addSchedule': 'Add Schedule',
        'button.removeDevice': 'Remove Device',
        'button.removeSchedule': 'Remove Schedule',
        'label.deviceName': 'Device Name',
        'label.deviceId': 'Device ID',
        'label.scheduleName': 'Task Name',
        'label.scheduleCanvasId': 'Canvas ID',
        'label.scheduleCron': 'Cron Expression',
        'label.scheduleParams': 'Params (JSON)',
        'hint.paramsFormat': 'Use JSON for params, e.g. {"key": "value"}.',
        'device.title': 'Device {index}',
        'schedule.title': 'Schedule {index}',
        'status.loading': 'Loading configuration...',
        'status.loaded': 'Configuration loaded.',
        'status.saved': 'Configuration saved.',
        'status.reloaded': 'Configuration reloaded from disk.',
        'status.saveError': 'Save failed: {message}',
        'status.loadError': 'Failed to load configuration: {message}',
        'status.paramsInvalid': 'Some schedule params are not valid JSON. Please review the highlighted fields.',
        'empty.devices': 'No devices configured yet. Click "Add Device" to get started.',
        'empty.schedules': 'This device has no schedules yet. Add one to begin.',
        'confirm.deleteDevice': 'Remove this device?',
        'confirm.deleteSchedule': 'Remove this schedule?',
        'placeholder.deviceName': 'Device1',
        'placeholder.deviceId': '1A2B3C4D1234',
        'placeholder.scheduleName': 'task1',
        'placeholder.scheduleCanvasId': 'canvas1',
        'placeholder.scheduleCron': '*/5 * * * *',
      },
    };

    const state = {
      language: translations[storedLanguage] ? storedLanguage : 'zh',
      loading: true,
      config: { api_key: '', devices: [] },
      paramsText: new Map(),
      invalidParams: new Set(),
      status: { key: 'status.loading', raw: null, type: 'info', params: {} },
      nextUid: 1,
    };

    function clone(value) {
      if (typeof structuredClone === 'function') {
        try {
          return structuredClone(value);
        } catch (err) {
          console.debug('structuredClone failed', err);
        }
      }
      try {
        return JSON.parse(JSON.stringify(value ?? null));
      } catch (err) {
        console.debug('JSON clone failed', err);
        return value;
      }
    }

    function t(key, params = {}) {
      const template = translations[state.language]?.[key] ?? translations.zh[key] ?? key;
      return template.replace(/\{(\w+)\}/g, (_, token) => (params[token] !== undefined ? params[token] : ''));
    }

    function setStatusKey(key, type = 'info', params = {}) {
      state.status = { key, params, type, raw: null };
      renderStatus();
    }

    function setStatusRaw(message, type = 'info') {
      state.status = { key: null, params: {}, type, raw: message };
      renderStatus();
    }

    function clearStatus() {
      state.status = { key: null, params: {}, type: 'info', raw: null };
      renderStatus();
    }

    function renderStatus() {
      const { key, params, type, raw } = state.status;
      if (!key && !raw) {
        statusBanner.style.display = 'none';
        statusBanner.textContent = '';
        statusBanner.classList.remove('info', 'success', 'error');
        return;
      }
      const message = raw ?? t(key, params);
      statusBanner.textContent = message;
      statusBanner.classList.remove('info', 'success', 'error');
      statusBanner.classList.add(type || 'info');
      statusBanner.style.display = 'block';
    }

    function normaliseConfig(raw) {
      const cfg = { api_key: '', devices: [] };
      if (raw && typeof raw === 'object') {
        cfg.api_key = typeof raw.api_key === 'string' ? raw.api_key : '';
        if (Array.isArray(raw.devices)) {
          cfg.devices = raw.devices
            .filter(device => device && typeof device === 'object')
            .map(device => {
              const deviceCopy = clone(device) ?? {};
              deviceCopy.name = typeof deviceCopy.name === 'string' ? deviceCopy.name : '';
              deviceCopy.device_id = typeof deviceCopy.device_id === 'string' ? deviceCopy.device_id : '';
              const schedules = Array.isArray(deviceCopy.schedules) ? deviceCopy.schedules : [];
              deviceCopy.schedules = schedules
                .filter(schedule => schedule && typeof schedule === 'object')
                .map(schedule => {
                  const scheduleCopy = clone(schedule) ?? {};
                  scheduleCopy.name = typeof scheduleCopy.name === 'string' ? scheduleCopy.name : '';
                  scheduleCopy.canvas_id = typeof scheduleCopy.canvas_id === 'string' ? scheduleCopy.canvas_id : '';
                  scheduleCopy.cron = typeof scheduleCopy.cron === 'string' ? scheduleCopy.cron : '';
                  const params = scheduleCopy.params;
                  if (!params || typeof params !== 'object' || Array.isArray(params)) {
                    scheduleCopy.params = {};
                  }
                  return scheduleCopy;
                });
              return deviceCopy;
            });
        }
      }
      cfg.devices = Array.isArray(cfg.devices) ? cfg.devices : [];
      return cfg;
    }

    function rebuildParamsText() {
      const fresh = new Map();
      state.config.devices.forEach(device => {
        device.schedules.forEach(schedule => {
          const key = paramsKey(schedule);
          if (!key) {
            return;
          }
          if (state.paramsText.has(key)) {
            fresh.set(key, state.paramsText.get(key));
          } else {
            try {
              fresh.set(key, JSON.stringify(schedule.params ?? {}, null, 2));
            } catch (err) {
              console.debug('Failed to stringify params', err);
              fresh.set(key, '{}');
            }
          }
        });
      });
      state.paramsText = fresh;
      state.invalidParams = new Set(
        Array.from(state.invalidParams).filter(key => state.paramsText.has(key))
      );
    }

    function assignScheduleIds() {
      let next = 1;
      state.config.devices.forEach(device => {
        device.schedules.forEach(schedule => {
          if (typeof schedule._uid !== 'number') {
            schedule._uid = next++;
          } else {
            next = Math.max(next, schedule._uid + 1);
          }
        });
      });
      state.nextUid = next;
    }

    function renderDevices() {
      devicesContainer.innerHTML = '';
      if (!state.config.devices.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-hint';
        empty.textContent = t('empty.devices');
        devicesContainer.appendChild(empty);
        return;
      }

      state.config.devices.forEach((device, deviceIndex) => {
        const deviceCard = document.createElement('div');
        deviceCard.className = 'device-card';

        const header = document.createElement('div');
        header.className = 'device-card__header';

        const title = document.createElement('div');
        title.className = 'device-card__title';
        title.textContent = t('device.title', { index: deviceIndex + 1 });
        header.appendChild(title);

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'danger';
        removeBtn.textContent = t('button.removeDevice');
        removeBtn.addEventListener('click', () => {
          if (!window.confirm(t('confirm.deleteDevice'))) {
            return;
          }
          const removed = state.config.devices[deviceIndex];
          if (removed && Array.isArray(removed.schedules)) {
            removed.schedules.forEach(schedule => {
              const key = paramsKey(schedule);
              if (key) {
                state.paramsText.delete(key);
                state.invalidParams.delete(key);
              }
            });
          }
          state.config.devices = state.config.devices.filter((_, idx) => idx !== deviceIndex);
          rebuildParamsText();
          render();
        });
        header.appendChild(removeBtn);
        deviceCard.appendChild(header);

        const nameGroup = document.createElement('div');
        nameGroup.className = 'field-group';
        const nameLabel = document.createElement('label');
        nameLabel.textContent = t('label.deviceName');
        nameGroup.appendChild(nameLabel);
        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.value = device.name ?? '';
        nameInput.placeholder = t('placeholder.deviceName');
        nameInput.addEventListener('input', event => {
          device.name = event.target.value;
        });
        nameGroup.appendChild(nameInput);
        deviceCard.appendChild(nameGroup);

        const idGroup = document.createElement('div');
        idGroup.className = 'field-group';
        const idLabel = document.createElement('label');
        idLabel.textContent = t('label.deviceId');
        idGroup.appendChild(idLabel);
        const idInput = document.createElement('input');
        idInput.type = 'text';
        idInput.value = device.device_id ?? '';
        idInput.placeholder = t('placeholder.deviceId');
        idInput.addEventListener('input', event => {
          device.device_id = event.target.value;
        });
        idGroup.appendChild(idInput);
        deviceCard.appendChild(idGroup);

        const scheduleList = document.createElement('div');
        scheduleList.className = 'schedule-list';

        if (!device.schedules.length) {
          const emptySchedule = document.createElement('div');
          emptySchedule.className = 'empty-hint';
          emptySchedule.textContent = t('empty.schedules');
          scheduleList.appendChild(emptySchedule);
        } else {
          device.schedules.forEach((schedule, scheduleIndex) => {
            const scheduleCard = document.createElement('div');
            scheduleCard.className = 'schedule-card';

            const scheduleHeader = document.createElement('div');
            scheduleHeader.className = 'schedule-card__header';

            const scheduleTitle = document.createElement('div');
            scheduleTitle.className = 'schedule-card__title';
            scheduleTitle.textContent = t('schedule.title', { index: scheduleIndex + 1 });
            scheduleHeader.appendChild(scheduleTitle);

            const removeScheduleBtn = document.createElement('button');
            removeScheduleBtn.type = 'button';
            removeScheduleBtn.className = 'secondary';
            removeScheduleBtn.textContent = t('button.removeSchedule');
            removeScheduleBtn.addEventListener('click', () => {
              if (!window.confirm(t('confirm.deleteSchedule'))) {
                return;
              }
              const keyToRemove = paramsKey(schedule);
              device.schedules = device.schedules.filter((_, idx) => idx !== scheduleIndex);
              if (keyToRemove) {
                state.paramsText.delete(keyToRemove);
                state.invalidParams.delete(keyToRemove);
              }
              rebuildParamsText();
              render();
            });
            scheduleHeader.appendChild(removeScheduleBtn);
            scheduleCard.appendChild(scheduleHeader);

            const nameField = document.createElement('div');
            nameField.className = 'field-group';
            const nameFieldLabel = document.createElement('label');
            nameFieldLabel.textContent = t('label.scheduleName');
            nameField.appendChild(nameFieldLabel);
            const nameFieldInput = document.createElement('input');
            nameFieldInput.type = 'text';
            nameFieldInput.value = schedule.name ?? '';
            nameFieldInput.placeholder = t('placeholder.scheduleName');
            nameFieldInput.addEventListener('input', event => {
              schedule.name = event.target.value;
            });
            nameField.appendChild(nameFieldInput);
            scheduleCard.appendChild(nameField);

            const inlineFields = document.createElement('div');
            inlineFields.className = 'field-inline';

            const canvasGroup = document.createElement('div');
            canvasGroup.className = 'field-group';
            const canvasLabel = document.createElement('label');
            canvasLabel.textContent = t('label.scheduleCanvasId');
            canvasGroup.appendChild(canvasLabel);
            const canvasInput = document.createElement('input');
            canvasInput.type = 'text';
            canvasInput.value = schedule.canvas_id ?? '';
            canvasInput.placeholder = t('placeholder.scheduleCanvasId');
            canvasInput.addEventListener('input', event => {
              schedule.canvas_id = event.target.value;
            });
            canvasGroup.appendChild(canvasInput);
            inlineFields.appendChild(canvasGroup);

            const cronGroup = document.createElement('div');
            cronGroup.className = 'field-group';
            const cronLabel = document.createElement('label');
            cronLabel.textContent = t('label.scheduleCron');
            cronGroup.appendChild(cronLabel);
            const cronInput = document.createElement('input');
            cronInput.type = 'text';
            cronInput.value = schedule.cron ?? '';
            cronInput.placeholder = t('placeholder.scheduleCron');
            cronInput.addEventListener('input', event => {
              schedule.cron = event.target.value;
            });
            cronGroup.appendChild(cronInput);
            inlineFields.appendChild(cronGroup);

            scheduleCard.appendChild(inlineFields);

            const paramsGroup = document.createElement('div');
            paramsGroup.className = 'field-group';
            const paramsLabel = document.createElement('label');
            paramsLabel.textContent = t('label.scheduleParams');
            paramsGroup.appendChild(paramsLabel);
            const paramsTextarea = document.createElement('textarea');
            const key = paramsKey(schedule);
            const storedText = key ? state.paramsText.get(key) : undefined;
            if (storedText !== undefined) {
              paramsTextarea.value = storedText;
            } else {
              try {
                paramsTextarea.value = JSON.stringify(schedule.params ?? {}, null, 2);
              } catch (err) {
                paramsTextarea.value = '{}';
              }
            }
            paramsTextarea.addEventListener('input', event => {
              if (key) {
                state.paramsText.set(key, event.target.value);
                if (state.invalidParams.has(key)) {
                  state.invalidParams.delete(key);
                  paramsTextarea.classList.remove('field-error');
                  clearStatus();
                }
              }
            });
            if (key && state.invalidParams.has(key)) {
              paramsTextarea.classList.add('field-error');
            }
            paramsGroup.appendChild(paramsTextarea);
            scheduleCard.appendChild(paramsGroup);

            scheduleList.appendChild(scheduleCard);
          });
        }

        deviceCard.appendChild(scheduleList);

        const addScheduleBtn = document.createElement('button');
        addScheduleBtn.type = 'button';
        addScheduleBtn.className = 'secondary';
        addScheduleBtn.textContent = t('button.addSchedule');
        addScheduleBtn.addEventListener('click', () => {
          const newSchedule = {
            name: '',
            canvas_id: '',
            cron: '',
            params: {},
          };
          const key = paramsKey(newSchedule);
          device.schedules.push(newSchedule);
          if (key) {
            state.paramsText.set(key, JSON.stringify(newSchedule.params, null, 2));
          }
          render();
        });
        deviceCard.appendChild(addScheduleBtn);

        devicesContainer.appendChild(deviceCard);
      });
    }

    function render() {
      apiKeyInput.disabled = state.loading;
      saveButton.disabled = state.loading;
      reloadButton.disabled = state.loading;
      addDeviceButton.disabled = state.loading;

      if (state.loading) {
        apiKeyInput.value = '';
        devicesContainer.innerHTML = '';
        const loading = document.createElement('div');
        loading.className = 'empty-hint';
        loading.textContent = t('status.loading');
        devicesContainer.appendChild(loading);
        return;
      }

      apiKeyInput.value = state.config.api_key ?? '';
      renderDevices();
    }

    function applyTranslations() {
      document.documentElement.lang = state.language === 'zh' ? 'zh' : 'en';
      document.title = t('header.title');
      languageSelect.value = state.language;
      document.querySelectorAll('[data-i18n]').forEach(elem => {
        const key = elem.dataset.i18n;
        if (!key) {
          return;
        }
        const isInput = elem instanceof HTMLInputElement && elem.type === 'text';
        if (isInput && elem.id === 'api-key-input') {
          elem.placeholder = state.language === 'zh' ? 'dot_app_xxxxxxxx' : 'dot_app_xxxxxxxx';
        }
        if (elem instanceof HTMLInputElement || elem instanceof HTMLTextAreaElement) {
          if (elem instanceof HTMLInputElement && elem.type === 'text') {
            elem.placeholder = t(key);
          }
          return;
        }
        elem.textContent = t(key);
      });
      // Update dynamic placeholders and labels that depend on t()
      render();
      renderStatus();
    }

    languageSelect.addEventListener('change', event => {
      const lang = event.target.value;
      if (translations[lang]) {
        state.language = lang;
        try {
          localStorage.setItem('dotcanvas-language', lang);
        } catch (err) {
          console.debug('Unable to persist language preference', err);
        }
        applyTranslations();
      }
    });

    apiKeyInput.addEventListener('input', event => {
      state.config.api_key = event.target.value;
    });

    saveButton.addEventListener('click', async () => {
      if (state.loading) {
        return;
      }
      const payload = clone(state.config);
      const invalidKeys = new Set();
      const errors = [];

      payload.devices.forEach((device, deviceIndex) => {
        device.schedules = Array.isArray(device.schedules) ? device.schedules : [];
        device.schedules.forEach((schedule, scheduleIndex) => {
          const key = scheduleKeyFromPayload(schedule);
          const text = key ? state.paramsText.get(key) ?? '' : '';
          const trimmed = text.trim();
          if (!trimmed) {
            schedule.params = {};
            if (key) {
              state.paramsText.set(key, '{}');
            }
            return;
          }
          try {
            const parsed = JSON.parse(trimmed);
            if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
              throw new Error('Params must be a JSON object');
            }
            schedule.params = parsed;
          } catch (err) {
            if (key) {
              invalidKeys.add(key);
            }
            errors.push(`${t('device.title', { index: deviceIndex + 1 })} / ${t('schedule.title', { index: scheduleIndex + 1 })}: ${err.message}`);
          }
        });
      });

      if (invalidKeys.size) {
        state.invalidParams = invalidKeys;
        render();
        if (errors.length) {
          setStatusRaw(errors.join('\n'), 'error');
        } else {
          setStatusKey('status.paramsInvalid', 'error');
        }
        return;
      }

      state.invalidParams.clear();
      render();

      payload.devices.forEach(device => {
        device.schedules.forEach(schedule => {
          if ('_uid' in schedule) {
            delete schedule._uid;
          }
        });
      });

      try {
        const res = await fetch('/config', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          const detail = await res.json().catch(() => ({}));
          const message = detail?.errors?.join?.(' \n') || detail?.detail || res.statusText;
          throw new Error(typeof message === 'string' ? message : JSON.stringify(message));
        }
        const data = await res.json();
        state.config = normaliseConfig(data.config);
        assignScheduleIds();
        rebuildParamsText();
        state.invalidParams.clear();
        setStatusKey('status.saved', 'success');
        render();
      } catch (err) {
        console.error('Failed to save config', err);
        setStatusKey('status.saveError', 'error', { message: err.message });
      }
    });

    reloadButton.addEventListener('click', async () => {
      await loadConfig(true);
    });

    addDeviceButton.addEventListener('click', () => {
      if (state.loading) {
        return;
      }
      state.config.devices.push({
        name: '',
        device_id: '',
        schedules: [],
      });
      render();
    });

    async function loadConfig(showSuccess = false) {
      state.loading = true;
      setStatusKey('status.loading', 'info');
      render();
      try {
        const res = await fetch('/config');
        if (!res.ok) {
          const detail = await res.json().catch(() => ({}));
          const message = detail?.detail || res.statusText;
          throw new Error(message);
        }
        const data = await res.json();
        state.config = normaliseConfig(data.config);
        assignScheduleIds();
        rebuildParamsText();
        state.invalidParams.clear();
        state.loading = false;
        setStatusKey(showSuccess ? 'status.reloaded' : 'status.loaded', 'success');
        render();
      } catch (err) {
        console.error('Failed to load config', err);
        state.loading = false;
        setStatusKey('status.loadError', 'error', { message: err.message });
        render();
      }
    }

    function init() {
      applyTranslations();
      languageSelect.value = state.language;
      loadConfig();
    }

    init();
  </script>
</body>
</html>
