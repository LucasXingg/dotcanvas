<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>DotCanvas 控制台</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 2rem 2.5rem 1rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 600;
    }

    .language-select {
      width: auto;
      min-width: 120px;
      font-family: inherit;
      background: rgba(15, 23, 42, 0.65);
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.6);
      border-radius: 6px;
      padding: 0.35rem 0.5rem;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.75rem;
      padding: 1.5rem 2.5rem 3rem 2.5rem;
    }

    .card {
      background: rgba(15, 23, 42, 0.85);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(148, 163, 184, 0.25);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card h2 {
      margin: 0;
      font-size: 1.4rem;
      color: #60a5fa;
    }

    .card p {
      margin: 0;
      line-height: 1.6;
      color: #cbd5f5;
      font-size: 0.95rem;
    }

    .card a {
      align-self: flex-start;
      text-decoration: none;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      font-weight: 600;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    .card a:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(79, 70, 229, 0.35);
    }

    footer {
      padding: 1.25rem 2.5rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1 data-i18n="header.title">DotCanvas 控制台</h1>
    <select id="language-select" class="language-select">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
  </header>

  <main>
    <div class="card">
      <h2 data-i18n="card.canvasTitle">画布管理器</h2>
      <p data-i18n="card.canvasDescription">管理画布和视图，实时预览效果并保存更改。</p>
      <a href="canvas.html" data-i18n="card.canvasAction">进入画布编辑</a>
    </div>
    <div class="card">
      <h2 data-i18n="card.daemonTitle">守护进程控制</h2>
      <p data-i18n="card.daemonDescription">查看计划任务和守护进程状态，执行启动或重启操作。</p>
      <a href="daemon.html" data-i18n="card.daemonAction">打开守护进程面板</a>
    </div>
  </main>

  <footer>
    <span data-i18n="footer.hint">提示：您可以随时从浏览器顶部地址栏切换页面，或使用上方卡片导航。</span>
  </footer>

  <script>
    const languageSelect = document.getElementById('language-select');

    const storedLanguage = (() => {
      try {
        return localStorage.getItem('dotcanvas-language');
      } catch (err) {
        console.debug('Unable to read language preference', err);
        return null;
      }
    })();

    const translations = {
      zh: {
        'header.title': 'DotCanvas 控制台',
        'card.canvasTitle': '画布管理器',
        'card.canvasDescription': '管理画布和视图，实时预览效果并保存更改。',
        'card.canvasAction': '进入画布编辑',
        'card.daemonTitle': '守护进程控制',
        'card.daemonDescription': '查看计划任务和守护进程状态，执行启动或重启操作。',
        'card.daemonAction': '打开守护进程面板',
        'footer.hint': '提示：您可以随时从浏览器顶部地址栏切换页面，或使用上方卡片导航。',
      },
      en: {
        'header.title': 'DotCanvas Console',
        'card.canvasTitle': 'Canvas Manager',
        'card.canvasDescription': 'Manage canvases and views, preview changes, and save updates.',
        'card.canvasAction': 'Open canvas editor',
        'card.daemonTitle': 'Daemon Control',
        'card.daemonDescription': 'Inspect scheduled tasks, review status, and run daemon actions.',
        'card.daemonAction': 'Open daemon dashboard',
        'footer.hint': 'Tip: Use the links above or bookmarks to switch between panels at any time.',
      },
    };

    let currentLanguage = translations[storedLanguage] ? storedLanguage : 'zh';

    function t(key) {
      return translations[currentLanguage]?.[key] ?? translations.zh[key] ?? key;
    }

    function applyTranslations() {
      document.documentElement.lang = currentLanguage === 'zh' ? 'zh' : 'en';
      document.title = t('header.title');
      languageSelect.value = currentLanguage;

      document.querySelectorAll('[data-i18n]').forEach(elem => {
        const key = elem.dataset.i18n;
        if (key) {
          elem.textContent = t(key);
        }
      });
    }

    function setLanguage(lang, persist = true) {
      if (!translations[lang]) {
        lang = 'zh';
      }
      currentLanguage = lang;
      if (persist) {
        try {
          localStorage.setItem('dotcanvas-language', lang);
        } catch (err) {
          console.debug('Unable to persist language preference', err);
        }
      }
      applyTranslations();
    }

    languageSelect.addEventListener('change', event => {
      setLanguage(event.target.value);
    });

    setLanguage(currentLanguage, false);
  </script>
</body>
</html>
